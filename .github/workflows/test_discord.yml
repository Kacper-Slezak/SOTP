# .github/workflows/test_discord.yml - Test Discord Notifier

name: 🧪 Discord Notifier Test

on:
  # Manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - success
          - failure

  # Automatic run on push of test-* tags
  push:
    tags:
      - 'test-*'

jobs:
  # ===================================================================
  # JOB 1: Simulate SUCCESS
  # ===================================================================
  simulate_success:
    name: ✅ Simulating Successful Job
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'success' || github.event.inputs.test_type == 'both' || github.event_name == 'push'
    timeout-minutes: 2

    steps:
      - name: 🎭 Mock successful operation
        run: |
          echo "==================================="
          echo "🚀 Starting deployment simulation..."
          echo "==================================="

          echo "✅ Database connection: OK"

          echo "✅ Services health check: OK"

          echo "✅ Deployment process: OK"

          echo "==================================="
          echo "🎉 Deployment completed successfully!"
          echo "==================================="

  # ===================================================================
  # JOB 2: Simulate FAILURE
  # ===================================================================
  simulate_failure:
    name: ❌ Simulating Failed Job
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'failure' || github.event.inputs.test_type == 'both' || github.event_name == 'push'
    timeout-minutes: 2

    steps:
      - name: 🎭 Mock failed operation
        run: |
          echo "==================================="
          echo "🚀 Starting deployment simulation..."
          echo "==================================="
          sleep 3

          echo "✅ Database connection: OK"
          sleep 2

          echo "❌ Services health check: FAILED"
          echo "Error: Connection timeout to service 'api-gateway'"
          sleep 2

          echo "==================================="
          echo "🚨 Deployment FAILED!"
          echo "==================================="
          exit 1  # This triggers a failure

  # ===================================================================
  # JOB 3: SUCCESS Notification
  # ===================================================================
  notify_success:
    name: 📢 Success Notification
    # ❌ DO NOT add runs-on here!
    needs: simulate_success
    if: success() && (github.event.inputs.test_type == 'success' || github.event.inputs.test_type == 'both' || github.event_name == 'push')
    uses: ./.github/workflows/discord_notifier.yml
    with:
      status: success
      environment: TEST-SUCCESS
      commit_sha: ${{ github.sha }}
      actor: ${{ github.actor }}
    secrets:
      webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}

  # ===================================================================
  # JOB 4: FAILURE Notification
  # ===================================================================
  notify_failure:
    name: 📢 Failure Notification
    # ❌ DO NOT add runs-on here!
    needs: simulate_failure
    if: failure() && (github.event.inputs.test_type == 'failure' || github.event.inputs.test_type == 'both' || github.event_name == 'push')
    uses: ./.github/workflows/discord_notifier.yml
    with:
      status: failure
      environment: TEST-FAILURE
      commit_sha: ${{ github.sha }}
      actor: ${{ github.actor }}
    secrets:
      webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}

  # ===================================================================
  # JOB 5: Test Summary
  # ===================================================================
  test_summary:
    name: 📊 Test Summary
    runs-on: ubuntu-latest
    needs: [notify_success, notify_failure]
    if: always()

    steps:
      - name: 📋 Display results
        run: |
          echo "==================================="
          echo "🧪 Discord Notifier Test Summary"
          echo "==================================="
          echo ""
          echo "Test Type: ${{ github.event.inputs.test_type || 'both (auto)' }}"
          echo "Triggered by: ${{ github.actor }}"
          echo ""
          echo "Results:"
          echo "  - Success notification: ${{ needs.notify_success.result || 'skipped' }}"
          echo "  - Failure notification: ${{ needs.notify_failure.result || 'skipped' }}"
          echo ""
          echo "✅ Check your Discord channel for notifications!"
          echo "==================================="
