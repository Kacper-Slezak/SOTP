# .github/workflows/deploy-prod.yml - Build & Package Release
#
# ⚠️ NOTE: This workflow does NOT deploy to a server (infrastructure not provisioned yet)
# Purpose: Build and publish Docker image for future deployment
#
# Triggers ONLY when a tag is pushed: git tag v1.0.0 && git push origin v1.0.0

name: 📦 Build Release

on:
  push:
    tags:
      - 'v*' # v1.0.0, v1.1.0, etc.

permissions:
  contents: read
  packages: write  # Required for pushing to GitHub Container Registry

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ===================================================================
  # JOB 1: BUILD & PUBLISH - Build and push Docker image
  # ===================================================================
  build_and_publish:
    name: 🐳 Build & Publish Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🏷️ Extract Version from Tag
        id: version
        run: |
          # Extract 1.2.0 from tag v1.2.0
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION"

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true  # Push to GitHub Container Registry
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=SOTP
            org.opencontainers.image.version=${{ steps.version.outputs.VERSION }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: ✅ Build Summary
        run: |
          echo "==================================="
          echo "🎉 Docker Image Published!"
          echo "==================================="
          echo "📦 Version: ${{ steps.version.outputs.VERSION }}"
          echo "🏷️ Tag: ${{ github.ref_name }}"
          echo "🐳 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo ""
          echo "Available tags:"
          echo "  - latest"
          echo "  - ${{ steps.version.outputs.VERSION }}"
          echo ""
          echo "🔗 View at: https://github.com/${{ github.repository }}/pkgs/container/${{ github.event.repository.name }}"
          echo "==================================="

  # ===================================================================
  # JOB 2: CREATE RELEASE NOTES - Create GitHub Release
  # ===================================================================
  create_release:
    name: 📝 Create GitHub Release
    runs-on: ubuntu-latest
    needs: build_and_publish
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch complete history for changelog generation

      - name: 🏷️ Extract Version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: 📝 Generate Changelog
        id: changelog
        run: |
          # Find previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "First release - no previous tag found"
            CHANGELOG="🎉 Initial release of SOTP v${{ steps.version.outputs.VERSION }}"
          else
            echo "Generating changelog from $PREVIOUS_TAG to ${{ github.ref_name }}"

            # Generate changelog from commits
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)

            # Add header
            CHANGELOG="## Changes since ${PREVIOUS_TAG}"$'\n\n'"${CHANGELOG}"
          fi

          # Write to file (GitHub Actions multi-line handling)
          echo "$CHANGELOG" > changelog.txt

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body_path: changelog.txt
          draft: false
          prerelease: false
          generate_release_notes: true  # GitHub automatically adds release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===================================================================
  # JOB 3: NOTIFY - Discord Notification
  # ===================================================================
  notify:
    name: 📢 Notify Release Status
    needs: [build_and_publish, create_release]
    if: always()
    uses: ./.github/workflows/discord_notifier.yml
    with:
      status: ${{ needs.build_and_publish.result == 'success' && needs.create_release.result == 'success' && 'success' || 'failure' }}
      environment: Release Build
      commit_sha: ${{ github.sha }}
      actor: ${{ github.actor }}
      version: ${{ github.ref_name }}
      deployment_url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    secrets:
      webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}

# ===================================================================
# 📚 HOW TO USE THIS WORKFLOW
# ===================================================================
#
# 1. Complete work on version 1.0.0
# 2. Create tag:
#    git tag v1.0.0 -m "Release version 1.0.0"
#    git push origin v1.0.0
#
# 3. Workflow automatically:
#    ✅ Builds Docker image
#    ✅ Pushes to GitHub Container Registry
#    ✅ Creates Release on GitHub
#    ✅ Sends Discord notification
#
# 4. In the future with a production server:
#    - Add "deploy" job with SSH deployment
#    - Add smoke tests
#    - Ready to use!
#
# ===================================================================
